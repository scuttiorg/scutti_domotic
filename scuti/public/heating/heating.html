<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chauffage</title>
  <link rel="stylesheet" href="heating.css">
</head>
<body>
  <main class="heating">
    <header class="heating__header">
      <h1>Chauffage</h1>
      <div>
        <button type="button" class="btn" data-action="new-site">Nouveau site</button>
        <button type="button" class="btn" data-action="new-room">Nouvelle pièce</button>
      </div>
    </header>

    <section id="sites" class="sites" aria-label="Sites"></section>

    <section id="rooms" class="rooms" aria-live="polite"></section>
  </main>

  <!-- Gabarits -->
  <template id="tpl-room">
    <article class="room" data-room>
      <header class="room__header">
        <h2 class="room__name"></h2>
        <span class="room__site"></span>
        <span class="badge" data-heating></span>
      </header>

      <div class="room__state">
        <span class="metric"><strong data-temp>—</strong> °C</span>
        <span class="metric"><strong data-hum>—</strong> %</span>
        <span class="metric">consigne <strong data-setpoint>—</strong> °C</span>
        <span class="muted" data-updated></span>
      </div>

      <div class="room__mode" role="group" aria-label="Mode">
        <button type="button" class="btn btn--small" data-mode="off">Arrêt</button>
        <button type="button" class="btn btn--small" data-mode="auto">Auto</button>
        <form class="inline" data-manual-form>
          <input type="number" step="0.5" min="5" max="30" name="setpoint" aria-label="Consigne manuelle">
          <select name="duration" aria-label="Durée">
            <option value="">sans limite</option>
            <option value="1">1 h</option>
            <option value="3">3 h</option>
            <option value="8">8 h</option>
          </select>
          <button type="submit" class="btn btn--small">Manuel</button>
        </form>
      </div>

      <table class="rules">
        <thead>
          <tr><th>Règle</th><th>Jours</th><th>Plage</th><th>Consigne</th><th></th></tr>
        </thead>
        <tbody data-rules></tbody>
      </table>

      <footer class="room__footer">
        <button type="button" class="btn btn--small" data-action="new-rule">Ajouter une règle</button>
        <button type="button" class="btn btn--small" data-action="edit-room">Modifier</button>
        <button type="button" class="btn btn--small btn--danger" data-action="delete-room">Supprimer</button>
      </footer>
    </article>
  </template>

  <template id="tpl-rule">
    <tr data-rule>
      <td data-name></td>
      <td data-days></td>
      <td data-range></td>
      <td data-setpoint></td>
      <td class="rules__actions">
        <button type="button" class="link" data-action="toggle-rule"></button>
        <button type="button" class="link" data-action="edit-rule">Modifier</button>
        <button type="button" class="link link--danger" data-action="delete-rule">Supprimer</button>
      </td>
    </tr>
  </template>

  <template id="tpl-site">
    <span class="site" data-site>
      <span data-name></span>
      <span class="muted" data-seen></span>
      <button type="button" class="link" data-action="rotate-token">Nouveau token</button>
      <button type="button" class="link link--danger" data-action="delete-site">Supprimer</button>
    </span>
  </template>

  <dialog id="dlg-site">
    <form method="dialog" class="form">
      <h3>Site</h3>
      <label>Nom <input name="name" required></label>
      <menu>
        <button type="button" class="btn" value="cancel">Annuler</button>
        <button type="submit" class="btn btn--primary" value="ok">Créer</button>
      </menu>
    </form>
  </dialog>

  <dialog id="dlg-token">
    <form method="dialog" class="form">
      <h3>Token de la passerelle</h3>
      <p>À copier dans <code>SCUTI_TOKEN</code> sur le Raspberry. <strong>Il ne sera plus affiché.</strong></p>
      <output><code data-token></code></output>
      <menu><button type="submit" class="btn btn--primary" value="ok">J'ai copié</button></menu>
    </form>
  </dialog>

  <dialog id="dlg-room">
    <form method="dialog" class="form">
      <h3>Pièce</h3>
      <label>Site <select name="site_id" required></select></label>
      <label>Nom <input name="name" required></label>
      <label>Capteur (nom Zigbee2MQTT) <input name="sensor_name" required></label>
      <label>Prise (nom Zigbee2MQTT) <input name="plug_name" required></label>
      <label>Consigne par défaut <input type="number" name="default_setpoint" step="0.5" min="5" max="30" value="17"></label>
      <label>Hystérésis <input type="number" name="hysteresis" step="0.1" min="0.2" max="3" value="0.5"></label>
      <label class="check"><input type="checkbox" name="enabled" checked> Activée</label>
      <menu>
        <button type="button" class="btn" value="cancel">Annuler</button>
        <button type="submit" class="btn btn--primary" value="ok">Enregistrer</button>
      </menu>
    </form>
  </dialog>

  <dialog id="dlg-rule">
    <form method="dialog" class="form">
      <h3>Règle</h3>
      <label>Nom <input name="name" required></label>
      <fieldset class="days">
        <legend>Jours</legend>
        <label><input type="checkbox" name="days" value="1"> L</label>
        <label><input type="checkbox" name="days" value="2"> M</label>
        <label><input type="checkbox" name="days" value="3"> M</label>
        <label><input type="checkbox" name="days" value="4"> J</label>
        <label><input type="checkbox" name="days" value="5"> V</label>
        <label><input type="checkbox" name="days" value="6"> S</label>
        <label><input type="checkbox" name="days" value="7"> D</label>
      </fieldset>
      <label>De <input type="time" name="time_from" required></label>
      <label>À <input type="time" name="time_to" required></label>
      <label>Consigne <input type="number" name="setpoint" step="0.5" min="5" max="30" required></label>
      <label>Priorité <input type="number" name="priority" min="0" max="100" value="10"></label>
      <label class="check"><input type="checkbox" name="enabled" checked> Activée</label>
      <menu>
        <button type="button" class="btn" value="cancel">Annuler</button>
        <button type="submit" class="btn btn--primary" value="ok">Enregistrer</button>
      </menu>
    </form>
  </dialog>

  <script type="module" src="heating.js"></script>
</body>
</html>
