homeassistant: false
# L'appairage s'ouvre depuis Scutti, qui envoie `bridge/request/permit_join`
# pour la durée demandée ; le bridge le referme tout seul à l'échéance.
permit_join: false

# Pas de `frontend` : l'interface web de Zigbee2MQTT est retirée. Tout ce
# qu'on y faisait (appairer, renommer) se fait dans Scutti.

mqtt:
  base_topic: zigbee2mqtt
  server: mqtt://mosquitto:1883
  # user / password : fournis par MQTT_USER / MQTT_PASSWORD dans .env

serial:
  port: /dev/ttyUSB0
  # adapter: ember            # décommenter pour un Sonoff ZBDongle-E

advanced:
  network_key: GENERATE
  pan_id: GENERATE
  ext_pan_id: GENERATE
  last_seen: ISO_8601
  log_level: warning

devices: {}
